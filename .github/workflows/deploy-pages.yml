name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build browser bundle
        run: npm run build
      - name: Assemble public static site
        run: |
          set -euo pipefail
          mkdir -p site/data site/downloads
          cp index.html styles.css favicon.svg app.bundle.mjs site/
          cp data/tmw-terms.json.gz site/data/
          cp downloads/*.apkg site/downloads/
          touch site/.nojekyll
          python3 -c 'from pathlib import Path; root=Path("site"); assert (root/"index.html").is_file(); assert (root/"app.bundle.mjs").is_file(); assert (root/"data/tmw-terms.json.gz").is_file(); packages=list((root/"downloads").glob("*.apkg")); assert len(packages)==9, f"Expected 9 typed decks, got {len(packages)}"; print(f"Prepared {len(packages)} typed APKGs and the dictionary")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
